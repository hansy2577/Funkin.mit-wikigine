    body {
      background: linear-gradient(180deg, #202f7bfc, #192560fc);

    }
    
    a {

      padding: 7px;
    }
    
    img {

    }
    
    h2 {
      background-color: #535ed459;
      padding: 10px;
      border-radius: 10px;
      color: #9fa5e9fc;
